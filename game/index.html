<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烬灯行者 · 遗迹原型</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #02060a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Songti SC", "SimSun", "Microsoft YaHei", serif; color: #d9eef2; }
  #stage { position: relative; width: 1280px; height: 720px; --s: 1; font-size: calc(16px * var(--s));
    box-shadow: 0 0 60px rgba(40,120,140,.25); background: #050b14; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #toolbar { position: absolute; top: .7em; right: .8em; display: flex; gap: .4em; z-index: 3; }
  #toolbar[hidden] { display: none; }
  button { font-family: inherit; font-size: .85em; color: #d9eef2; background: rgba(10,28,40,.78);
    border: 1px solid rgba(130,220,235,.45); border-radius: .35em; padding: .35em .8em; cursor: pointer;
    letter-spacing: .05em; }
  button:hover { background: rgba(24,62,80,.9); }
  button:focus-visible { outline: 2px solid #ffc978; outline-offset: 2px; }
  .overlay { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(4,14,22,.72), rgba(2,6,10,.93)); }
  .overlay[hidden] { display: none; }
  .overlay h1 { font-size: 3.3em; margin: 0 0 .1em; font-weight: normal; letter-spacing: .25em; color: #f1e7d0;
    text-shadow: 0 0 1em rgba(110,220,240,.55); }
  .overlay h2 { font-size: 2.4em; margin: 0 0 .3em; font-weight: normal; letter-spacing: .2em; color: #f1e7d0;
    text-shadow: 0 0 .8em rgba(110,220,240,.5); }
  .overlay p { margin: .3em 0; color: #9cc4cc; font-size: 1em; }
  .sub { letter-spacing: .4em; color: #6fb9c6 !important; font-size: .9em !important; margin-bottom: 1.4em !important; }
  .keys { display: grid; grid-template-columns: auto auto; gap: .35em 1.2em; margin: .8em 0 1.4em; text-align: left;
    font-size: .95em; color: #b9dbe1; }
  .keys kbd { font-family: Consolas, monospace; background: rgba(120,210,225,.12); border: 1px solid rgba(130,220,235,.4);
    border-radius: .3em; padding: .05em .5em; color: #f1e7d0; }
  .big { font-size: 1.15em; padding: .55em 2.2em; margin: .3em; border-color: #ffc978; color: #ffe9c4; }
  .row { display: flex; gap: .6em; margin-top: .6em; flex-wrap: wrap; justify-content: center; }
  .note { font-size: .78em !important; color: #5f8d97 !important; margin-top: 1.2em !important; }
  #sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="烬灯行者：横版动作平台游戏画面"></canvas>
  <div id="toolbar" hidden>
    <button id="btnPause" type="button" aria-label="暂停 (Esc)">暂停</button>
    <button id="btnMute" type="button" aria-pressed="false">声音：开</button>
    <button id="btnShake" type="button" aria-pressed="true">震屏：开</button>
  </div>
  <div class="overlay" id="ovTitle">
    <h1>烬灯行者</h1>
    <p class="sub">CINDERWICK · 地下遗迹原型</p>
    <div class="keys" aria-label="操作说明">
      <span><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd></span><span>移动</span>
      <span><kbd>Space</kbd></span><span>跳跃（短按低跳，长按高跳）</span>
      <span><kbd>Shift</kbd></span><span>水平冲刺（有冷却，无无敌）</span>
      <span><kbd>J</kbd></span><span>挥击</span>
      <span><kbd>E</kbd> / <kbd>↑</kbd></span><span>点燃烬灯台 · 在灯旁休息回满生命</span>
      <span><kbd>Esc</kbd> 暂停　<kbd>M</kbd> 静音</span><span><kbd>F3</kbd> 调试显示</span>
    </div>
    <p>穿过三间遗迹：点燃烬灯台，击败守卫，进入尽头的拱门。</p>
    <button class="big" id="btnStart" type="button">开始</button>
    <p class="note">学习用玩法原型 · 全部画面与声音由程序生成</p>
  </div>
  <div class="overlay" id="ovPause" hidden>
    <h2>暂停</h2>
    <p>A/D 移动 · Space 跳跃 · Shift 冲刺 · J 挥击 · E 烬灯台</p>
    <p class="note">“重新开始”会清除本局全部进度，包括已点燃的烬灯台。</p>
    <div class="row">
      <button class="big" id="btnResume" type="button">继续</button>
      <button class="big" id="btnRestartP" type="button">重新开始</button>
    </div>
    <div class="row">
      <button id="btnMute2" type="button">声音：开</button>
      <button id="btnShake2" type="button">震屏：开</button>
    </div>
  </div>
  <div class="overlay" id="ovDead" hidden>
    <h2>灯火熄灭</h2>
    <p id="deadMsg">行者倒在了遗迹深处。</p>
    <button class="big" id="btnRetry" type="button">醒来</button>
    <div class="row"><button id="btnRestartD" type="button">重新开始（清除进度）</button></div>
  </div>
  <div class="overlay" id="ovWin" hidden style="background: radial-gradient(ellipse at center, rgba(4,14,22,.35), rgba(2,6,10,.8))">
    <h2>穿过拱门</h2>
    <p id="winStats">—</p>
    <button class="big" id="btnReplay" type="button">重玩</button>
  </div>
  <div id="sr" aria-live="polite"></div>
</div>
<script>
(() => {
'use strict';

/* =====================================================================
 * CONFIG —— 以下全部为本原型自定数值（非任何原作参数），单位：像素 / 秒
 * ===================================================================== */
const CONFIG = {
  view: { w: 1280, h: 720 },
  step: 1 / 120,          // 固定逻辑步长
  maxFrame: 0.1,          // 单帧最多累计的时间（挂起后不追帧）
  player: {
    w: 26, h: 50,         // 地形碰撞框
    hurtW: 18, hurtH: 42, // 身体受击框（比地形框小）
    runSpeed: 340, accelGround: 3600, accelAir: 2600, friction: 3200, airDrag: 1100,
    gravity: 2400, maxFall: 1100,
    jumpVel: 760, jumpCutVel: 240,   // 松开跳跃键时把上升速度截到该值 → 低跳
    coyote: 0.09, jumpBuffer: 0.12,
    dashSpeed: 880, dashTime: 0.16, dashCooldown: 0.6,
    atkWindup: 0.06, atkActive: 0.10, atkRecover: 0.16, atkBuffer: 0.10,
    atkReach: 86, atkInner: 4, atkTop: 52, atkBottom: 4, atkDamage: 1,
    maxHp: 5, invuln: 1.1, hurtLock: 0.28, knockX: 420, knockY: 380,
    respawnInvuln: 1.2, deathTime: 1.2,
  },
  guard: {
    w: 60, h: 88,         // 身体受击框
    hp: 8,                // 出生点和活动范围在房间数据里（ROOMS.hall.enemies）
    patrolSpeed: 70, chaseSpeed: 165, idleTime: 1.0,
    sightRange: 460, loseTime: 1.5, noticeTime: 0.5,
    attackRange: 125,     // 与玩家中心距离小于该值时开始蓄力
    windup: 0.65, swingActive: 0.18, recover: 0.95, lunge: 260,
    hitInner: 10, hitReach: 150, hitHeight: 58,  // 低位横扫判定：可后撤或跳过
    damage: 1, knockOnHit: 150, deathTime: 1.3,
  },
  fx: { hitStop: 0.07, shakeHit: 5, shakeHurt: 9, shakeTime: 0.2 },
  camera: { lerp: 6, lookAhead: 90, lookLerp: 3 },
  crawler: {              // 锈壳虫：来回爬行的小敌人，身体接触造成伤害
    w: 44, h: 26, hp: 2, speed: 55, turnPause: 0.35,
    damage: 1, knockOnHit: 230, stun: 0.3, deathTime: 0.45,
  },
  hazard: { damage: 1, safeMargin: 100 },   // safeMargin：离荆棘坑边缘多远的地面才记为安全落点
  room: { fadeOut: 0.16, fadeIn: 0.22, nameTime: 2.6 },
  checkpoint: { reach: 56 },
  audio: { master: 0.8, ambient: 0.05 },
};
const VW = CONFIG.view.w, VH = CONFIG.view.h;

/* ---------------- Rooms ----------------
 * 三个房间的布局均为本项目自行设计，不是任何原作地图的复现。坐标是各房间自己的局部坐标（像素）。
 *   solids     实心矩形             oneways  单向平台        hazards  荆棘坑（碰到扣血并回到最近的安全落点）
 *   exits      出口触发区 → 目标房间的 entries[entry]         enemies  每次进入房间时按此重新生成
 *   checkpoint 烬灯台（检查点）     door     最终出口        dummy    训练木桩
 * 带出口的一侧：墙在 DOOR_TOP 以下留出门洞；门洞外另有一道实心挡块，即使触发失效也走不出房间。 */
const GY = 600, DOOR_H = 170, DOOR_TOP = GY - DOOR_H;
const edgeWest = open => open ? [{ x: -400, y: -600, w: 470, h: 600 + DOOR_TOP }, { x: -400, y: -600, w: 300, h: 1300 }] : [{ x: -400, y: -600, w: 440, h: 1300 }];
const edgeEast = (W, open) => open ? [{ x: W - 70, y: -600, w: 470, h: 600 + DOOR_TOP }, { x: W + 100, y: -600, w: 300, h: 1300 }] : [{ x: W - 40, y: -600, w: 440, h: 1300 }];
const exitWest = (to, entry) => ({ id: 'west', side: -1, x: -105, y: DOOR_TOP, w: 150, h: DOOR_H, to, entry });
const exitEast = (W, to, entry) => ({ id: 'east', side: 1, x: W - 45, y: DOOR_TOP, w: 150, h: DOOR_H, to, entry });
const entryWest = () => ({ x: 130, y: GY });          // 落点离出口触发区约 75px，不会进门就再次触发
const entryEast = W => ({ x: W - 130, y: GY });
const PAL = {   // 每个房间一套色调
  teal:   { sky: ['#0d2a3a', '#143f50', '#0a1c28'], glow: 'rgba(90,200,220,A)', far: '#0a1b29', farLine: 'rgba(40,90,110,.18)', mid: '#0e2636', midHi: 'rgba(60,130,150,.25)', near: '#12303f', nearHi: 'rgba(80,160,180,.28)', beam: '120,220,240', fog: '70,160,180' },
  moss:   { sky: ['#0f2e2b', '#17463f', '#0a1f1e'], glow: 'rgba(110,210,170,A)', far: '#0b201f', farLine: 'rgba(50,110,95,.18)', mid: '#0f2b2a', midHi: 'rgba(70,150,130,.25)', near: '#143733', nearHi: 'rgba(90,175,150,.28)', beam: '150,225,190', fog: '80,170,140' },
  violet: { sky: ['#141f3a', '#1c2c52', '#0b1226'], glow: 'rgba(110,150,235,A)', far: '#0c1428', farLine: 'rgba(60,80,140,.2)', mid: '#111c36', midHi: 'rgba(90,110,190,.25)', near: '#162443', nearHi: 'rgba(110,130,210,.28)', beam: '140,170,245', fog: '90,120,200' },
};
const ROOMS = {
  // 房间 1：入口回廊。沿用原型的教学段（移动、跳跃、挥击、荆棘坑），右端出口通向烬灯庭。
  entry: { name: '入口回廊', w: 2000, seed: 0, pal: PAL.teal,
    solids: [
      { x: -400, y: GY, w: 1800, h: 400 },          // 左侧地面（到 x=1400）
      { x: 1550, y: GY, w: 850, h: 400 },           // 右侧地面
      { x: 960, y: 552, w: 84, h: 48 },             // 练习区石块
      ...edgeWest(false), ...edgeEast(2000, true),
    ],
    oneways: [
      { x: 480, y: 528, w: 140, h: 16 },
      { x: 1150, y: 520, w: 140, h: 16 },
      { x: 1410, y: 455, w: 130, h: 16 },
      { x: 1680, y: 520, w: 140, h: 16 },
    ],
    hazards: [{ x: 1400, y: 652, w: 150, h: 200 }],
    exits: [exitEast(2000, 'court', 'west')],
    entries: { east: entryEast(2000) },
    enemies: [],
    dummy: { x: 800, y: GY, w: 30, h: 70 },
    lanterns: [300, 900, 1240, 1720].map(x => ({ x, y: GY })),
    hints: [
      { x: 200, y: 430, t: 'A / D 移动' },
      { x: 550, y: 430, t: 'Space 跳跃 · 长按更高' },
      { x: 800, y: 470, t: 'J 挥击' },
      { x: 1250, y: 400, t: 'Shift 冲刺越过荆棘' },
      { x: 1850, y: 400, t: '烬灯庭 →' },
    ],
  },
  // 房间 2：烬灯庭。两级台阶上的高台放烬灯台；东侧是带落脚石的宽荆棘坑，另有一条高处的平台路线。
  court: { name: '烬灯庭', w: 2640, seed: 7, pal: PAL.moss,
    solids: [
      { x: -400, y: GY, w: 2050, h: 400 },          // 西侧地面（到 x=1650）
      { x: 1950, y: GY, w: 1090, h: 400 },          // 东侧地面
      { x: 700, y: 540, w: 300, h: 60 },            // 西台阶
      { x: 1000, y: 480, w: 420, h: 120 },          // 高台（烬灯台）
      { x: 1420, y: 540, w: 110, h: 60 },           // 东台阶
      ...edgeWest(true), ...edgeEast(2640, true),
    ],
    oneways: [
      { x: 1755, y: 560, w: 90, h: 16 },            // 荆棘坑中央的落脚石
      { x: 1560, y: 440, w: 120, h: 16 },           // 高处路线
      { x: 1800, y: 420, w: 120, h: 16 },
    ],
    hazards: [{ x: 1650, y: 652, w: 300, h: 200 }],
    exits: [exitWest('entry', 'east'), exitEast(2640, 'hall', 'west')],
    entries: { west: entryWest(), east: entryEast(2640) },
    enemies: [
      { id: 'c1', type: 'crawler', x: 520, y: GY, min: 380, max: 660, dir: -1 },
      { id: 'c2', type: 'crawler', x: 2250, y: GY, min: 2160, max: 2340, dir: 1 },
    ],
    checkpoint: { id: 'court', x: 1210, y: 480 },
    lanterns: [{ x: 250, y: GY }, { x: 840, y: 540 }, { x: 1590, y: GY }, { x: 2050, y: GY }, { x: 2440, y: GY }],
    hints: [
      { x: 430, y: 440, t: '锈壳虫 · 碰到会受伤' },
      { x: 2420, y: 400, t: '守卫厅 →' },
    ],
  },
  // 房间 3：守卫厅。沿用原型的守卫战和尽头拱门；击败守卫后拱门开启，进门即通关。
  hall: { name: '守卫厅', w: 1600, seed: 13, pal: PAL.violet,
    solids: [
      { x: -400, y: GY, w: 2400, h: 400 },
      ...edgeWest(true), ...edgeEast(1600, false),
    ],
    oneways: [],
    hazards: [],
    exits: [exitWest('court', 'east')],
    entries: { west: entryWest() },
    enemies: [{ id: 'guard', type: 'guard', x: 1050, y: GY, arenaMin: 400, arenaMax: 1400, patrolMin: 750, patrolMax: 1300 }],
    door: { x: 1450, y: 470, w: 76, h: 130 },
    lanterns: [{ x: 600, y: GY }, { x: 1200, y: GY }],
    hints: [{ x: 480, y: 430, t: '看清蓄力 · 退开或跳起 · 趁喘息反击' }],
  },
};
for (const id in ROOMS) ROOMS[id].id = id;
const START = { room: 'entry', x: 160, y: GY };   // 未点燃任何烬灯台时的重生点

/* ---------------- Utils ---------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sign = v => v < 0 ? -1 : 1;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function los(ax, ay, bx, by) { // 视线检测：线段采样是否穿过实心地形
  for (let i = 1; i < 12; i++) {
    const t = i / 12, x = lerp(ax, bx, t), y = lerp(ay, by, t);
    for (const s of G.room.solids) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return false;
  }
  return true;
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const stage = $('stage');

/* =====================================================================
 * Audio —— WebAudio 程序合成，首次用户手势后启动
 * ===================================================================== */
function noiseBuf(ac) {
  if (ac._nb) return ac._nb;
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0), r = rng(1234);
  for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1;
  return ac._nb = b;
}
function envGain(ac, t, a, d, peak) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  return g;
}
function tone(ac, out, t, o) {
  const osc = ac.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f0, t);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  const g = envGain(ac, t, o.a || 0.005, o.dur, o.peak);
  osc.connect(g); g.connect(out); osc.start(t); osc.stop(t + o.dur + (o.a || 0.005) + 0.03);
}
function noise(ac, out, t, o) {
  const src = ac.createBufferSource(); src.buffer = noiseBuf(ac); src.loop = true;
  const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
  f.frequency.setValueAtTime(o.f0, t);
  if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
  const g = envGain(ac, t, o.a || 0.004, o.dur, o.peak);
  src.connect(f); f.connect(g); g.connect(out); src.start(t); src.stop(t + o.dur + (o.a || 0.004) + 0.03);
}
const SFX = {
  jump:   { dur: 0.25, f(ac, o, t) { tone(ac, o, t, { type: 'triangle', f0: 300, f1: 610, dur: 0.13, peak: 0.22 }); noise(ac, o, t, { f0: 900, f1: 1800, dur: 0.07, peak: 0.05 }); } },
  land:   { dur: 0.25, f(ac, o, t) { tone(ac, o, t, { f0: 110, f1: 52, dur: 0.11, peak: 0.3 }); noise(ac, o, t, { type: 'lowpass', f0: 500, f1: 180, dur: 0.09, peak: 0.16 }); } },
  dash:   { dur: 0.35, f(ac, o, t) { noise(ac, o, t, { f0: 700, f1: 2600, dur: 0.2, peak: 0.6, q: 1.0, a: 0.01 }); tone(ac, o, t, { type: 'sawtooth', f0: 180, f1: 90, dur: 0.12, peak: 0.09 }); } },
  swing:  { dur: 0.25, f(ac, o, t) { noise(ac, o, t, { f0: 2400, f1: 700, dur: 0.12, peak: 0.55, q: 1.2 }); tone(ac, o, t, { type: 'triangle', f0: 900, f1: 420, dur: 0.08, peak: 0.05 }); } },
  hit:    { dur: 0.3,  f(ac, o, t) { tone(ac, o, t, { type: 'square', f0: 240, f1: 95, dur: 0.1, peak: 0.2 }); noise(ac, o, t, { type: 'highpass', f0: 1800, dur: 0.06, peak: 0.22 }); tone(ac, o, t, { type: 'triangle', f0: 1250, f1: 880, dur: 0.14, peak: 0.1 }); } },
  hurt:   { dur: 0.45, f(ac, o, t) { tone(ac, o, t, { type: 'sawtooth', f0: 330, f1: 85, dur: 0.28, peak: 0.22 }); noise(ac, o, t, { type: 'lowpass', f0: 1400, f1: 300, dur: 0.2, peak: 0.2 }); } },
  alert:  { dur: 0.4,  f(ac, o, t) { tone(ac, o, t, { type: 'square', f0: 520, dur: 0.07, peak: 0.1 }); tone(ac, o, t + 0.11, { type: 'square', f0: 700, dur: 0.1, peak: 0.1 }); } },
  charge: { dur: 0.85, f(ac, o, t) {
      const osc = ac.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(62, t); osc.frequency.exponentialRampToValueAtTime(230, t + 0.62);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(300, t); lp.frequency.exponentialRampToValueAtTime(1800, t + 0.62);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2, t + 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      const lfo = ac.createOscillator(); lfo.frequency.value = 22; const lg = ac.createGain(); lg.gain.value = 0.07;

function hurtPlayer(n, fromX, opt = {}) {

function updatePlayer(dt) {
  const p = G.player, c = CONFIG.player;
  p.invT = Math.max(0, p.invT - dt); p.flashT = Math.max(0, p.flashT - dt); p.landT = Math.max(0, p.landT - dt);

    if (p.deadT > c.deathTime) setMode('dead');
    return;
  }
  // 输入边沿 → 缓冲
  if (inp.jumpP) { p.jumpBufT = c.jumpBuffer; inp.jumpP = false; }
  if (inp.atkP) { p.atkBufT = c.atkBuffer; inp.atkP = false; }
  const dashPressed = inp.dashP; inp.dashP = false;
  const interactPressed = inp.interactP; inp.interactP = false;
  p.jumpBufT -= dt; p.atkBufT -= dt; p.coyoteT -= dt; p.dashCd = Math.max(0, p.dashCd - dt); p.hurtT = Math.max(0, p.hurtT - dt);
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const locked = p.hurtT > 0;
  if (interactPressed && !locked && p.dashT <= 0 && nearCheckpoint()) useCheckpoint();

  // 冲刺
  if (dashPressed && !locked && p.dashT <= 0 && p.dashCd <= 0 && !(p.airDash && !p.onGround)) {
    p.dashDir = dir || p.facing; p.facing = p.dashDir; p.dashT = c.dashTime; p.dashCd = c.dashCooldown; p.vy = 0; p.jumping = false;
    if (!p.onGround) p.airDash = true;
    G.stats.dashes++; sfx('dash'); puff(p.x, p.y, 5, 'rgba(170,225,235,.5)', 60);
  }
  // 攻击
  if (p.atkT >= 0) { p.atkT += dt; if (p.atkT >= c.atkWindup + c.atkActive + c.atkRecover) p.atkT = -1; }
  if (p.atkBufT > 0 && p.atkT < 0 && !locked) { p.atkT = 0; p.atkBufT = 0; p.atkFacing = p.facing; p.atkHit = new Set(); G.stats.swingsMade++; sfx('swing'); }

  if (p.dashT > 0) {

  } else {

    else {
      const acc = p.onGround ? (dir ? c.accelGround : c.friction) : (dir ? c.accelAir : c.airDrag);
      p.vx = approach(p.vx, dir * c.runSpeed, acc * dt);

    }

    if (!locked && p.jumpBufT > 0 && (p.onGround || p.coyoteT > 0)) {

    }

  const wasGround = p.onGround, fallV = p.vy;
  moveBody(p, c.w, c.h, (p.vx + push) * dt, p.vy * dt);

    const m = CONFIG.hazard.safeMargin;
    if (p.groundKind === 'solid' && p.hurtT <= 0 && G.room.hazards.every(hz => p.x < hz.x - m || p.x > hz.x + hz.w + m)) { p.safe.x = p.x; p.safe.y = p.y; }
  }
  // 动画量

  p.cloakLag = lerp(p.cloakLag, Math.max(0, fwd), 1 - Math.exp(-10 * dt));
  p.cloakFlare = lerp(p.cloakFlare, p.onGround ? 0 : clamp(p.vy / 700, -0.5, 1), 1 - Math.exp(-12 * dt));

}

function setEnemy(e, s) { e.state = s; e.t = 0; }
function killGuard(g) { setEnemy(g, 'dead'); g.deadT = 0; g.vx = 0; G.prog.guardDefeated = true; sfx('guardDie'); shake(10); sparks(g.x, g.y - 50, 30, '#ffb070'); }
function updateGuard(g, dt) {
  const c = CONFIG.guard, h = g.home, p = G.player;   // h：该守卫在房间数据里的活动范围
  g.flashT = Math.max(0, g.flashT - dt); g.t += dt;
  g.hpShown = approach(g.hpShown, g.hp, dt * 3);
  if (g.state === 'dead') {
    g.deadT += dt;
    if (g.deadT < 1 && G.steps % 6 === 0) spawn({ x: g.x + (Math.random() - .5) * 60, y: g.y - Math.random() * 80, vx: (Math.random() - .5) * 60, vy: -60 - Math.random() * 80, life: .9, size: 3 + Math.random() * 3, color: '#ffb070', glow: true });
    if (!G.door.unlocked && g.deadT > c.deathTime) { G.door.unlocked = true; sfx('door'); shake(4); }

      break;
    case 'idle':
      if (g.t > c.idleTime) setEnemy(g, 'patrol');
      if (sees) { setEnemy(g, 'notice'); sfx('alert'); }
      break;
    case 'notice':
      g.facing = sign(dx); if (g.t > c.noticeTime) { setEnemy(g, 'chase'); g.lostT = 0; }
      break;
    case 'chase':
      if (adx > 6) g.facing = sign(dx);
      g.lostT = sees ? 0 : g.lostT + dt;
      if (g.lostT > c.loseTime) { g.dir = g.x > (h.patrolMin + h.patrolMax) / 2 ? -1 : 1; setEnemy(g, 'patrol'); break; }

      else if (adx > c.attackRange - 25) g.vx = g.facing * c.chaseSpeed;
      break;
    case 'windup':

      break;

// 锈壳虫：在房间数据给定的 [min, max] 之间来回爬，不追踪玩家；碰到身体会受伤。
function updateCrawler(e, dt) {
  const c = CONFIG.crawler, h = e.home;
  e.flashT = Math.max(0, e.flashT - dt); e.t += dt;
  if (e.state === 'dead') { e.deadT += dt; return; }
  let vx = 0;
  if (e.state === 'stun') { if (e.t > c.stun) setEnemy(e, 'walk'); }
  else if (e.state === 'turn') { if (e.t > c.turnPause) { e.dir = -e.dir; e.facing = e.dir; setEnemy(e, 'walk'); } }
  else if ((e.dir > 0 && e.x >= h.max) || (e.dir < 0 && e.x <= h.min)) setEnemy(e, 'turn');
  else { vx = e.dir * c.speed; e.facing = e.dir; e.walkPhase += c.speed * dt * 0.14; }

function updateEnemies(dt) {
  for (const e of G.enemies) (e.type === 'guard' ? updateGuard : updateCrawler)(e, dt);
  for (let i = G.enemies.length - 1; i >= 0; i--) { const e = G.enemies[i]; if (e.type === 'crawler' && e.state === 'dead' && e.deadT > CONFIG.crawler.deathTime) G.enemies.splice(i, 1); }
}

function updateCombat() {
  const p = G.player, cp = CONFIG.player, cg = CONFIG.guard, cc = CONFIG.crawler, room = G.room;
  // 玩家挥击：仅有效帧，单次挥击对同一目标至多一次
  if (!p.dead && atkPhase(p) === 'active') {
    const ab = pAtkBox(p);
    for (const e of G.enemies) {
      if (e.state === 'dead' || p.atkHit.has(e.id)) continue;
      if (e.type === 'guard') {
        if (!overlap(ab, gHurt(e)) || !los(p.x, p.y - 28, e.x, e.y - 44)) continue;
        p.atkHit.add(e.id); e.hp -= cp.atkDamage; e.flashT = 0.12; G.stats.hitsDealt++;
        if (e.state !== 'windup' && e.state !== 'swing') e.kvx = p.atkFacing * cg.knockOnHit;
        G.hitStop = CONFIG.fx.hitStop; shake(CONFIG.fx.shakeHit); sfx('hit');
        sparks(clamp(p.x + p.atkFacing * 60, e.x - 30, e.x + 30), p.y - 30, 12, '#fff3d0', p.atkFacing);
        if (e.hp <= 0) { e.hp = 0; killGuard(e); }
        else if (e.state === 'patrol' || e.state === 'idle') { setEnemy(e, 'notice'); sfx('alert'); }
      } else {
        if (!overlap(ab, cHurt(e)) || !los(p.x, p.y - 28, e.x, e.y - 14)) continue;
        p.atkHit.add(e.id); e.hp -= cp.atkDamage; e.flashT = 0.12; e.kvx = p.atkFacing * cc.knockOnHit;
        G.hitStop = CONFIG.fx.hitStop; shake(CONFIG.fx.shakeHit); sfx('hit');
        sparks(e.x, e.y - 16, 10, '#fff3d0', p.atkFacing);
        if (e.hp <= 0) { e.hp = 0; setEnemy(e, 'dead'); e.deadT = 0; G.stats.crawlerKills++; sfx('crawlerDie'); sparks(e.x, e.y - 14, 16, '#ffb070'); }
        else setEnemy(e, 'stun');
      }
    }

      p.atkHit.add('dummy'); G.dummy.wobV += p.atkFacing * 9; G.hitStop = CONFIG.fx.hitStop * 0.7; shake(3); sfx('hit');
      sparks(dm.x, p.y - 30, 8, '#d8f4ff', p.atkFacing);
    }
  }

  for (const e of G.enemies) {
    if (p.dead || e.state === 'dead') continue;
    if (e.type === 'guard') {
      if (e.state === 'swing' && !e.hitDone && overlap(gAtkBox(e), pHurt(p)) && los(e.x, e.y - 40, p.x, p.y - 25) && hurtPlayer(cg.damage, e.x)) e.hitDone = true;
    } else if (overlap(cHurt(e), pHurt(p))) hurtPlayer(cc.damage, e.x);
  }

  for (const hz of room.hazards) {
    if (p.dead || !overlap(pHurt(p), hz)) continue;
    G.stats.hazardFalls++;
    hurtPlayer(CONFIG.hazard.damage, p.x, { force: true, sound: 'thorn' });
    if (!p.dead) {
      p.x = p.safe.x; p.y = p.safe.y; p.vx = 0; p.vy = 0; p.onGround = true; p.groundKind = 'solid';
      p.invT = cp.respawnInvuln; p.hurtT = 0.35; p.dashT = 0; G.fade = 1;

  const d = G.dummy; d.wobV += -d.wob * 0.25; d.wobV *= 0.92; d.wob += d.wobV * 0.1;
  // 最终出口：守卫被击败后开启，进入即通关
  if (G.door.unlocked) {
    G.door.openT = Math.min(1, G.door.openT + CONFIG.step / 0.9);
    if (room.door && G.door.openT >= 0.6 && !p.dead && overlap(pHurt(p), room.door)) { sfx('win'); setMode('win'); }
  }
}

function updateExits() {   // 走进出口触发区 → 开始淡出；切换期间不再触发
  const p = G.player; if (p.dead || G.trans) return;
  const hb = pHurt(p);
  for (const ex of G.room.exits) if (overlap(hb, ex)) { G.trans = { phase: 'out', t: 0, to: ex.to, entry: ex.entry, floorY: ex.y + ex.h }; sfx('pass'); return; }
}

function updateCamera(dt, snap) {
  const p = G.player, c = CONFIG.camera, cam = G.cam, maxX = G.room.w - VW;
  cam.look = lerp(cam.look, p.facing * c.lookAhead, 1 - Math.exp(-c.lookLerp * dt));
  const tx = clamp(p.x + cam.look - VW / 2, 0, maxX);
  cam.x = snap ? tx : lerp(cam.x, tx, 1 - Math.exp(-c.lerp * dt));
  cam.x = clamp(cam.x, 0, maxX);
}

function step(dt) {
  G.time += dt; G.steps++;
  if (G.shakeT > 0) G.shakeT -= dt;
  G.fade = Math.max(0, G.fade - dt * 2.5);
  if (G.mode !== 'play') { if (G.mode !== 'pause') updateParts(dt); return; }
  G.roomT += dt; G.cpPulse = Math.max(0, G.cpPulse - dt * 1.6);
  if (G.trans) {   // 房间切换：淡出期间模拟静止，换房后边淡入边恢复操作
    const tr = G.trans; tr.t += dt;
    if (tr.phase === 'out') { if (tr.t < CONFIG.room.fadeOut) return; enterRoom(tr.to, tr.entry, tr.floorY); tr.phase = 'in'; tr.t = 0; }
    else if (tr.t >= CONFIG.room.fadeIn) G.trans = null;
  }
  if (G.hitStop > 0) { G.hitStop -= dt; return; }
  G.runTime += dt;
  updatePlayer(dt);
  if (G.mode !== 'play') return;
  updateEnemies(dt);
  updateCombat();
  if (G.mode !== 'play') return;
  updateExits();
  updateCamera(dt);

}

// 按房间数据生成该房间的全部离屏画布：三层视差、地形层、前景层。每个房间只生成一次并缓存。

  for (let i = 0; i < 5; i++) { const x = ((i * 430 + 120) - cx * .28) % 2100; const a = .035 + Math.sin(t * .5 + i) * .012; g.fillStyle = `rgba(${pal.beam},${a})`; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 90, 0); g.lineTo(x - 130, VH); g.lineTo(x - 300, VH); g.fill(); }
  const fog = g.createLinearGradient(0, 400, 0, 620); fog.addColorStop(0, `rgba(${pal.fog},0)`); fog.addColorStop(1, `rgba(${pal.fog},.13)`); g.fillStyle = fog; g.fillRect(0, 400, VW, 220);

  for (const h of room.hints) { if (h.x < cx - 300 || h.x > cx + VW + 300) continue; g.fillStyle = 'rgba(175,230,238,.42)'; g.fillText(h.t, h.x, h.y); g.fillStyle = 'rgba(175,230,238,.18)'; g.fillRect(h.x - 30, h.y + 9, 60, 1); }
  // 灯

  for (const l of room.lanterns) { const x = l.x; if (x < cx - 300 || x > cx + VW + 300) continue; const f = .85 + Math.sin(t * 5 + x) * .06 + Math.sin(t * 13 + x * 2) * .03; glow(g, x + 22, l.y - 114, 190, 'rgba(110,220,240,A)', .26 * f); glow(g, x + 22, l.y - 114, 26, 'rgba(220,250,255,A)', .9 * f); }
  for (const hz of room.hazards) glow(g, hz.x + hz.w / 2, hz.y + 48, Math.max(150, hz.w * .7), 'rgba(255,70,90,A)', .22 + Math.sin(t * 3) * .05);
  if (!p.dead) glow(g, p.x, p.y - 28, 120, 'rgba(150,225,240,A)', .13);
  g.restore();
  if (room.checkpoint) drawCheckpoint(g, room.checkpoint, t);

  g.globalAlpha = 1;
  g.restore();

  for (const m of MOTES) { const x = (((m.x - cx * m.z + Math.sin(t * .3 + m.ph) * 30) % 1600) + 1600) % 1600 - 160, y = (((m.y - t * 8 * m.z + Math.sin(t * .5 + m.ph) * 12) % VH) + VH) % VH; g.fillStyle = `rgba(170,235,245,${(.14 + .14 * Math.sin(t * 1.5 + m.ph)) * m.z})`; g.beginPath(); g.arc(x, y, m.s * m.z, 0, 7); g.fill(); }
  g.restore();
  g.drawImage(gfx.fore.c, Math.round(-cx * gfx.fore.factor - PAD + shx), Math.round(-PAD + shy));

}

/* =====================================================================
 * Main loop —— 固定步长 + 累计上限
 * ===================================================================== */
function frame(now) {
  requestAnimationFrame(frame);
  if (!G.last) G.last = now;
  let dt = (now - G.last) / 1000; G.last = now;
  if (dt > CONFIG.maxFrame) dt = CONFIG.maxFrame;   // 长时间挂起后不追帧
  if (dt < 0) dt = 0;
  G.acc += dt;
  let n = 0;
  while (G.acc >= CONFIG.step && n < 16) { step(CONFIG.step); G.acc -= CONFIG.step; n++; }
  if (n >= 16) G.acc = 0;
  render();
}
function resize() {
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  stage.style.width = Math.floor(VW * s) + 'px'; stage.style.height = Math.floor(VH * s) + 'px'; stage.style.setProperty('--s', s.toFixed(4));
}
window.addEventListener('resize', resize);

/* ---------------- 只读调试接口 ---------------- */
window.__dbg = {
  state() {
    const p = G.player, e = G.enemies.find(x => x.type === 'guard'), gd = G.prog.guardDefeated;
    return JSON.parse(JSON.stringify({
      mode: G.mode, runTime: G.runTime, steps: G.steps, hitStop: Math.max(0, G.hitStop), debug: G.debug, shakeOn: G.shakeOn, camX: G.cam.x,
      room: G.roomId, roomW: G.room.w, roomT: G.roomT, trans: G.trans ? G.trans.phase : null,
      player: { x: p.x, y: p.y, vx: p.vx, vy: p.vy, facing: p.facing, onGround: p.onGround, groundKind: p.groundKind, hp: p.hp, invT: p.invT, hurtT: p.hurtT, dashT: Math.max(0, p.dashT), dashCd: p.dashCd, atk: atkPhase(p), state: p.state, dead: p.dead, safe: p.safe },
      // guard：守卫不在当前房间时 present=false；已击败时 state 为 'dead'
      guard: e ? { present: true, x: e.x, state: e.state, t: e.t, hp: e.hp, facing: e.facing, swings: e.swings }
               : { present: false, x: null, state: gd ? 'dead' : 'absent', t: 0, hp: gd ? 0 : CONFIG.guard.hp, facing: 0, swings: 0 },
      enemies: G.enemies.map(x => ({ id: x.id, type: x.type, x: x.x, y: x.y, state: x.state, hp: x.hp, facing: x.facing })),
      progress: { checkpoint: G.prog.checkpoint, lit: Object.keys(G.prog.lit), guardDefeated: gd, visited: Object.keys(G.prog.visited) },
      nearCheckpoint: nearCheckpoint(),
      door: G.door, stats: G.stats, input: inp, heldKeys: [...heldCodes],
      audio: { ctx: Audio.ac ? Audio.ac.state : 'none', sampleRate: Audio.ac ? Audio.ac.sampleRate : null, muted: Audio.muted, error: Audio.error, played: Audio.played },
      renderer: 'Canvas 2D', gfx: { rooms: Object.keys(GFX).length, parts: G.parts.length, ghosts: G.ghosts.length },
    }));
  },
  config: () => JSON.parse(JSON.stringify(CONFIG)),
  rooms: () => JSON.parse(JSON.stringify({ start: START, rooms: ROOMS }, (k, v) => k === 'pal' ? undefined : v)),
  audioSelfTest,
};
// 状态注入接口：仅在 URL 带 ?test=1 时存在，仅供明确标注的测试使用
if (/[?&]test=1/.test(location.search)) window.__test = { G, CONFIG, ROOMS, hurtPlayer, setMode, resetGame, step, loadRoom, enterRoom, respawn, updateCamera };

for (const id in ROOMS) roomGfx(ROOMS[id]);   // 启动时一次生成三个房间的画布，切换房间时不再创建
buildVignette(); resize(); updateCamera(0, true);
$('btnStart').focus({ preventScroll: true });
requestAnimationFrame(frame);
})();
</script>
